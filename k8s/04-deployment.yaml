apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-troubleshooting-agent
  namespace: k8s-agent
  labels:
    app.kubernetes.io/name: kubernetes-troubleshooting-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-troubleshooting-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-troubleshooting-agent
    spec:
      serviceAccountName: troubleshooter-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: troubleshooting-agent
          image: kubernetes-troubleshooting-agent:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: troubleshooter-config
          # For AWS Bedrock / OpenAI secrets (optional, external secret / Kube secret):
          # env:
          #   - name: OPENAI_API_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: ai-credentials
          #         key: openai-api-key
          #         optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
