apiVersion: v1
kind: Pod
metadata:
  name: demo-oom-pod
  namespace: default
  labels:
    app: demo-oom
spec:
  containers:
    - name: memory-hog
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
      resources:
        limits:
          memory: "64Mi"
        requests:
          memory: "32Mi"
