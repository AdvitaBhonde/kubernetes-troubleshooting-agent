apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: troubleshooter-reader-role
  labels:
    app.kubernetes.io/name: kubernetes-troubleshooting-agent
rules:
  # Read-only access to Core resources (NO access to Secrets)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - events
      - services
      - endpoints
      - namespaces
      - nodes
      - configmaps
    verbs: ["get", "list", "watch"]

  # Read-only access to Workload controllers
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Read-only access to batch jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: troubleshooter-reader-binding
  labels:
    app.kubernetes.io/name: kubernetes-troubleshooting-agent
subjects:
  - kind: ServiceAccount
    name: troubleshooter-sa
    namespace: k8s-agent
roleRef:
  kind: ClusterRole
  name: troubleshooter-reader-role
  apiGroup: rbac.authorization.k8s.io
